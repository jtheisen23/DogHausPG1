# Must match the Worker's name in the Cloudflare dashboard (Workers Builds checks it).
name = "doghaus-pg1"
main = "worker/src/index.js"
compatibility_date = "2025-09-01"
# Keep variables/secrets set in the Cloudflare dashboard (e.g. BOOTSTRAP_ADMINS) on deploy.
keep_vars = true

# The dashboard UI (HTML/JS/CSS). Requests that don't match a file fall
# through to the Worker, which serves /api/*.
[assets]
directory = "./public"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
# Create it with `npx wrangler d1 create doghaus-pg1`, then paste its database_id here.
database_name = "doghaus-pg1"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "db/migrations"

[vars]
AUTH_MODE = "access"
# Repository whose "Toast sync" workflow the cron triggers start. The token
# (GITHUB_DISPATCH_TOKEN) is a secret set in the Cloudflare dashboard.
GITHUB_REPO = "jtheisen23/DogHausPG1"
# Zero Trust team domain that issues the login tokens (Zero Trust > Settings > Team domain).
ACCESS_TEAM_DOMAIN = "REPLACE_WITH_TEAM.cloudflareaccess.com"
# Application Audience (AUD) tag from Zero Trust > Access controls > Applications > doghaus-pg1.
# Until this and ACCESS_TEAM_DOMAIN are set, the API refuses every request.
ACCESS_AUD = "REPLACE_WITH_ACCESS_AUD_TAG"
# BOOTSTRAP_ADMINS (comma-separated emails that are always admins) is set as a
# secret in the Cloudflare dashboard so it isn't published in this repo.

# Admin > Add user also updates this reusable Cloudflare Access policy, so people
# can sign in without being added in Cloudflare too (worker/src/access-policy.js).
# Needs the Worker secret ACCESS_POLICY_TOKEN (Account > Access: Apps and
# Policies > Edit); without it, add people to the policy by hand.
# Cloudflare account "Dog Haus PG1".
CLOUDFLARE_ACCOUNT_ID = "0a0a421dcf08c2ca33fc134180d17698"
ACCESS_POLICY_NAME = "Dog Haus PG1 dashboard users"

# Starts the Toast sync on GitHub Actions (worker/src/scheduler.js). Times are UTC:
# hourly at :17, plus 8:40 UTC (~4:40am Eastern, 3:40am in winter) for the 7-day recheck.
[triggers]
crons = ["17 * * * *", "40 8 * * *"]

[observability]
enabled = true
